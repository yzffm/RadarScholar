[project]
name = "radarscholar-backend"
version = "0.1.0"
description = "RadarScholar — Scholarship Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4==4.15.0",
    "google-genai>=0.1.0",
    "groq>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (security)
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # FastAPI Depends is intentionally declared in endpoint signatures
    "E501",  # endpoint and prompt strings may exceed the style limit
    "UP042", # str enums preserve compatibility with Pydantic/FastAPI schemas
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
