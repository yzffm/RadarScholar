name: Probe Curated Scholarship Sources

on:
  workflow_dispatch:
  # TEMPORARY: scoped push trigger to execute probe on fix/crawler-resilience
  # before merging to main. MUST BE REMOVED before merging to main.
  push:
    branches:
      - fix/crawler-resilience
    paths:
      - '.github/workflows/probe.yml'
      - 'backend/scripts/probe_sources.py'

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Source Reachability & robots.txt Probe
        working-directory: ./backend
        run: |
          python -m scripts.probe_sources

