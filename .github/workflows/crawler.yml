name: Run Curated Crawler Pipeline

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  crawl:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_password
          POSTGRES_DB: radarscholardb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The crawler pipeline relies on SQLAlchemy and httpx/beautifulsoup4
          pip install beautifulsoup4 httpx

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://radar:radar_password@localhost:5432/radarscholardb
        run: |
          alembic upgrade head

      - name: Run Curated Crawler
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://radar:radar_password@localhost:5432/radarscholardb
        run: |
          python -m app.crawler.main
